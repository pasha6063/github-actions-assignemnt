name: Event Triggers

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  show-event:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Display event details
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"
          echo "Runner OS: $RUNNER_OS"
